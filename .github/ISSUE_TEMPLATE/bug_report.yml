name: Bug report
description: Report a reproducible PocketLab problem
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please use a private security advisory instead for vulnerabilities.
  - type: input
    id: version
    attributes:
      label: PocketLab version
      placeholder: 0.1.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows, macOS, Linux, Other]
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: v24.x
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include the command, smallest message/recording possible, and exact steps. Remove secrets first.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      render: shell
